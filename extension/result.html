<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SnipyNest — Your capture</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="theme.js"></script>
  <script type="module" src="result.js"></script>
</head>
<body class="result-page">
  <main>
    <header class="brand-header"><span class="brand-mark"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H4a1 1 0 0 0-1 1v4m13-5h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m8 0h4a1 1 0 0 0 1-1v-4"/><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></span><div><span class="brand-name">SnipyNest</span><p class="brand-caption">Browser companion</p></div><label class="theme-choice">Theme<select data-theme-choice aria-label="Theme"><option value="light">Light</option><option value="dark">Dark</option></select></label></header>
    <p id="theme-status" role="alert"></p>
    <section class="result-toolbar" aria-labelledby="capture-title">
      <div><h1 id="capture-title">Your capture</h1><p id="status" role="status" aria-live="polite" aria-atomic="true">Loading the captured PNG…</p></div>
      <div class="result-actions"><button id="copy" type="button" disabled>Copy image</button><a id="save" class="save-action" download="SnipyNest-page.png" hidden>Save PNG</a></div>
    </section>
    <p class="intro">Copy to paste into another app, or save the original PNG. This page keeps your image available until you close it.</p>
    <div class="image-stage"><img id="image" alt="Captured webpage" hidden></div>
  </main>
</body>
</html>
